<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MediStock-Babil — Babylon Health Directorate Pharmacy Department">
  <defs>
    <linearGradient id="phoenixIconBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.55" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#0B3B5C"/>
    </linearGradient>
    <linearGradient id="phoenixIconCross" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#phoenixIconBg)"/>

  <!-- pharmacy / medical cross -->
  <g fill="url(#phoenixIconCross)">
    <rect x="218" y="98" width="76" height="256" rx="20"/>
    <rect x="106" y="210" width="300" height="76" rx="20"/>
  </g>

  <!-- inventory grid: supply/command identity -->
  <g fill="#FFFFFF" opacity="0.92">
    <rect x="140" y="366" width="46" height="46" rx="10"/>
    <rect x="233" y="366" width="46" height="46" rx="10"/>
    <rect x="326" y="366" width="46" height="46" rx="10"/>
  </g>
</svg>
