<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>W1 Shell A11y Preview — touch targets + focus ring</title>
  <!-- Loads the REAL production CSS so sizing/focus/theming match the app 1:1. -->
  <link rel="stylesheet" href="/src/shared/lib/tokens.css" />
  <link rel="stylesheet" href="/src/shared/lib/global.css" />
  <link rel="stylesheet" href="/src/shared/lib/phoenix-nexus.css" />
  <style>
    /* Screenshot stability only: kill infinite ambient animations + heavy
       backdrop-filters that stall the headless compositor. Does NOT touch the
       control sizing or focus-ring rules under test. */
    *, *::before, *::after { animation: none !important; backdrop-filter: none !important; }
    body.premium-shell.nexus-shell::before,
    body.premium-shell.nexus-shell::after { display: none !important; }
    body { margin: 0; min-height: 100dvh; }
    .harness { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .harness__meta { font: 600 12px/1.4 var(--font-sans); color: var(--t2); }
    .harness__ruler { font: 600 11px var(--font-sans); color: var(--p); }
    /* Reproduces PhoenixTopbar.tsx markup + classes verbatim. */
    .premium-topbar {
      display: flex; align-items: center; gap: 12px; padding: 0 18px;
      background: var(--s); border-bottom: 1px solid var(--brd);
    }
  </style>
</head>
<body class="premium-shell nexus-shell">
  <div class="harness">
    <div class="harness__ruler" id="ruler"></div>

    <header class="premium-topbar" style="min-height: var(--tbh);">
      <button class="premium-drawer-trigger premium-focus-ring nexus-control" style="flex-shrink:0" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="nexus-topbar-title">
        <span class="nexus-topbar-eyebrow" id="eyebrow"></span>
        <h1 class="nexus-topbar-heading" id="heading"></h1>
      </div>
      <div style="display:flex; align-items:center; gap:7px; flex-shrink:0;">
        <button class="nexus-control nexus-control--language" id="langBtn" aria-label="Switch language"></button>
        <button class="nexus-control" id="themeBtn" aria-label="Toggle theme">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <p class="harness__meta" id="hint"></p>
  </div>

  <script type="module">
    const root = document.documentElement;
    const q = new URLSearchParams(location.search);
    const lang = q.get('lang') || 'ar';
    const theme = q.get('theme') || 'light';
    root.setAttribute('data-theme', theme);
    root.setAttribute('lang', lang);
    root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.getElementById('eyebrow').textContent =
      lang === 'ar' ? 'دائرة صحة بابل · قسم الصيدلة' : 'BABIL HEALTH · PHARMACY DEPARTMENT';
    document.getElementById('heading').textContent = lang === 'ar' ? 'لوحة الشبكة' : 'Network Dashboard';
    document.getElementById('langBtn').textContent = lang === 'ar' ? 'EN' : 'عربي';
    document.getElementById('hint').textContent =
      lang === 'ar'
        ? 'اضغط Tab لإظهار حلقة التركيز. كل زر ≥ 44×44px.'
        : 'Press Tab to reveal the focus ring. Every control is ≥ 44×44px.';

    // Live 44px audit rendered into the page so the screenshot is self-proving.
    requestAnimationFrame(() => {
      const controls = [...document.querySelectorAll('.nexus-control, .premium-drawer-trigger')];
      const rows = controls.map(el => {
        const r = el.getBoundingClientRect();
        const ok = r.width >= 44 && r.height >= 44;
        return `${(el.getAttribute('aria-label')||el.id||'ctl')}: ${Math.round(r.width)}×${Math.round(r.height)} ${ok ? 'OK' : 'FAIL'}`;
      });
      const noOverflow = document.documentElement.scrollWidth <= window.innerWidth;
      document.getElementById('ruler').textContent =
        `[${theme} · ${root.getAttribute('dir')}] ` + rows.join('  |  ') +
        `  ||  no-h-overflow: ${noOverflow ? 'OK' : 'FAIL'}`;
    });
  </script>
</body>
</html>
