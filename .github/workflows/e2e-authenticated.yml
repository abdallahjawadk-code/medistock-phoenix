name: E2E authenticated acceptance

# PR #57 Phase 2 fallback: local Docker/Rancher Desktop container-runtime
# recovery was exhausted in-session (both hit reproducible WSL2
# init/bootstrap failures on that machine) — this workflow is the sanctioned
# fallback, per explicit instruction: an ephemeral Supabase stack plus
# authenticated Playwright-driven acceptance, with NO Production credentials
# and NO Production data anywhere in this workflow.
#
# Every URL/key used here is `supabase start`'s own fixed local-dev output
# (127.0.0.1, well-known demo keys) — never a repository secret, never the
# Production project ref. tools/e2e-fixtures/seed.mjs and
# tools/e2e-acceptance/run.mjs both hard-refuse to run against anything that
# isn't a recognized local address.

# ============================================================================
# EMISSION CONTRACT (Stage I / I-6, reviewed) — RUNS FOR EVERY PR TO MASTER.
#
# THIS WORKFLOW MUST NOT BE PATH-FILTERED, because I-1B makes its job name a
# REQUIRED status check on master.
#
# GitHub blocks a pull request whose required context never arrives. A
# path-filtered workflow does not run at all for a non-matching PR, so the
# context is never reported and the PR sits permanently "Expected — waiting for
# status to be reported". Repository rulesets have no conditional or
# path-scoped form of required_status_checks: the only related knobs are
# strict_required_status_checks_policy (branch freshness) and
# do_not_enforce_on_create (branch creation), neither of which makes a
# requirement conditional on the diff. So a required context must be
# unconditional.
#
# This was measured, not assumed. Against the ten-path matrix this workflow
# previously carried, 5 of 15 open pull requests touched none of those paths
# and would have deadlocked; PRs #153 and #154 had already merged with the
# context absent. Hence: no `paths:`, and `branches: [master]` so it covers
# exactly the ref the ruleset guards.
#
# WHAT IT PROVES, AND WHAT IT DOES NOT.
# It builds the REAL production bundle, starts a disposable Supabase with
# supabase/migrations applied, seeds real Auth users, serves the built app and
# drives it with a real browser. The surfaces that change what it proves are
# supabase/migrations/**, src/app/**, src/shared/authz/**,
# src/shared/supabase/**, src/features/outlet/**, tools/e2e-fixtures/**,
# tools/e2e-acceptance/**, package.json and package-lock.json.
#
# It does NOT exercise the Production migration executor. A green result here
# is not evidence of executor correctness; that remains proven by
# production-migration-executor-contract.test.ts and by pg-rig's TLS
# mixed-history acceptance. Running unconditionally is a required-check
# necessity, not a claim that this job covers everything it runs on.
#
# tests/e2e-authenticated-trigger-contract.test.ts pins the absence of a
# `paths:` filter, so a future edit cannot silently reintroduce the deadlock.
# ============================================================================
on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: e2e-authenticated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-acceptance:
    name: Authenticated browser acceptance (disposable local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0 (pinned by hash for supply-chain safety, matching this repo's other actions)
        with:
          version: latest

      - name: Supply migration 085's historical cutover attestation (transaction-local, ephemeral checkout only)
        # M085-ATTESTED-EPHEMERAL-PREPARATION
        #
        # This step USED to move 085 out of the migration directory, on the
        # belief — mirrored from tools/pg-rig/rig.mjs's since-retired
        # PREPARED_ONLY_SKIP — that 085 had never been applied anywhere. Live
        # read-only inspection of Production disproved that:
        # supabase_migrations.schema_migrations records version 085
        # (phoenix_revoke_manual_availability_writers) once, its stored payload
        # carries both writer REVOKEs, and the live functions carry 085's own
        # COMMENT text with authenticated EXECUTE = NO. Production APPLIED it.
        #
        # Skipping it here made this disposable stack diverge from ACTUAL
        # Production history, exactly as the rig did. The canonical rig now
        # replays 085 with its attestation, so this job must too.
        #
        # 085's own source stays fail-closed and its REPOSITORY BYTES ARE NEVER
        # MODIFIED. Only this ephemeral runner's discarded checkout is
        # transformed, and only by inserting a TRANSACTION-LOCAL attestation
        # immediately after the migration's own BEGIN;. SET LOCAL is used
        # deliberately: it lives and dies with 085's own transaction, so it
        # cannot leak into 086+ and cannot be observed by any later connection
        # (asserted after startup by the M085/M194 security proof step below).
        #
        # The transform is fail-closed: it verifies 085's exact SHA-256 first,
        # requires exactly one BEGIN; insertion point, and requires the
        # attestation to be inserted exactly once. Any structural drift aborts
        # the job rather than silently producing a differently-shaped 085.
        run: |
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const { createHash } = require('node:crypto');

          const PATH = 'supabase/migrations/085_phoenix_revoke_manual_availability_writers.sql';
          const EXPECTED_SHA256 = 'b69326713c273f468bd53b8d66430ac907aff54f27c06ab9149427833eb20ab0';
          const ATTESTATION = "SET LOCAL phoenix.availability_cutover_attested = 'true';";

          const raw = readFileSync(PATH);
          const sha = createHash('sha256').update(raw).digest('hex');
          if (sha !== EXPECTED_SHA256) {
            console.error(`::error::085 SHA-256 mismatch. expected ${EXPECTED_SHA256}, got ${sha}. ` +
              'Migration 085 is IMMUTABLE — refusing to transform an unexpected file.');
            process.exit(1);
          }

          const text = raw.toString('utf8');
          const begins = text.match(/^BEGIN;$/gm) ?? [];
          if (begins.length !== 1) {
            console.error(`::error::expected exactly one standalone "BEGIN;" in 085, found ${begins.length}`);
            process.exit(1);
          }
          // Match the EXACT statement we insert, never a loose substring:
          // 085's own RAISE message legitimately contains
          // `SET phoenix.availability_cutover_attested = ''true''` as operator
          // guidance, which a broader check mistakes for an existing insertion.
          if (text.includes(ATTESTATION)) {
            console.error('::error::085 already contains the SET LOCAL attestation — refusing to double-insert');
            process.exit(1);
          }

          const out = text.replace(/^BEGIN;$/m,
            'BEGIN;\n' +
            '-- E2E-CI-ONLY (this ephemeral checkout only — never committed).\n' +
            '-- Historical cutover attestation for the migration Production already\n' +
            '-- applied. SET LOCAL keeps it inside THIS transaction only.\n' +
            ATTESTATION);

          const inserted = (out.match(/SET LOCAL phoenix\.availability_cutover_attested = 'true';/g) ?? []).length;
          if (inserted !== 1) {
            console.error(`::error::attestation inserted ${inserted} times, expected exactly 1`);
            process.exit(1);
          }
          if (!/^BEGIN;\n-- E2E-CI-ONLY/m.test(out)) {
            console.error('::error::attestation was not inserted at the expected BEGIN; insertion point');
            process.exit(1);
          }

          writeFileSync(PATH, out);
          console.log('085 prepared: transaction-local attestation inserted exactly once, after its own BEGIN;.');
          NODE

      - name: Apply the migration-023 replay shim (mirrors tools/pg-rig/rig.mjs's shimSql — documented, already-proven, repo file never touched)
        # 023_phoenix_live_profile_role_resolution_fix.sql's own verification
        # DO block asserts on pg_policies.qual for dp_insert_perm, an INSERT
        # policy whose predicate actually lives in pg_policies.with_check —
        # qual is NULL there, so a genuinely fresh replay aborts with "VERIFY
        # FAILED: dp_insert_perm policy missing from distribution_points".
        # This is a pre-existing, already-documented defect in migration 023
        # itself (predates PR #57; tools/pg-rig/rig.mjs's own top-of-file
        # comment names it "the DR gap" and
        # supabase/migrations/__tests__/dr-023-replay.dynamic.test.ts proves
        # both that "023 as written aborts on a fresh replay (the DR gap is
        # real)" and that this exact substitution — reading
        # coalesce(qual, with_check) instead of qual — "replays cleanly" and
        # "still catches a genuinely missing policy". Applied ONLY to this
        # ephemeral runner's disposable checkout, exactly like the 085
        # exclusion above — the committed repository file is never modified,
        # per this repo's explicit policy (see rig.mjs's own comment: "the
        # repository file 023 is never modified").
        run: |
          sed -i -E 's/SELECT[[:space:]]+qual[[:space:]]+INTO/SELECT coalesce(qual, with_check) INTO/gi' \
            supabase/migrations/023_phoenix_live_profile_role_resolution_fix.sql

      - name: Reproduce Production's recorded M182 function bodies (ephemeral replay only)
        # M182-PRODUCTION-BODY-REPLAY-NORMALIZATION
        #
        # A read-only Production measurement proved that the payload recorded
        # for migration 182 contains compact bodies for exactly these two
        # functions, while the later repository representation of historical
        # M182 contains expanded/comment-rich forms with the same behavior:
        #   * get_effective_permissions(uuid)
        #   * phoenix_profile_has_permission(uuid,text)
        # Migration 196 correctly fingerprints Production's live bodies. A
        # fresh local replay must therefore reproduce the recorded historical
        # representation before reaching 196, or it is not a Production-faithful
        # DR rehearsal.
        #
        # The canonical rig owns the correction and pins the exact M182 source
        # SHA plus exact before/after body hashes. This workflow imports that
        # same helper so there is no second SQL copy to drift. Only this
        # disposable runner checkout is written; committed M182 and Production
        # remain untouched. Any unexpected source/body shape aborts fail-closed.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { shimSql } from './tools/pg-rig/rig.mjs';

          const NAME = '182_phoenix_health_center_facility_scoped_rbac.sql';
          const PATH = `supabase/migrations/${NAME}`;
          const raw = readFileSync(PATH, 'utf8');
          const normalized = shimSql(NAME, raw);
          if (normalized === raw) {
            console.error('::error::M182 replay normalization made no change; refusing to continue');
            process.exit(1);
          }
          writeFileSync(PATH, normalized, 'utf8');
          console.log('M182 replay normalized to the two exact Production-recorded function bodies.');
          NODE

      - name: Prepend the default-privileges bootstrap to migration 001 (mirrors tools/pg-rig/bootstrap.sql — must run BEFORE any CREATE TABLE, not after)
        # This step used to APPEND these two ALTER DEFAULT PRIVILEGES
        # statements to the end of 001, which only affects tables created
        # AFTER that point (e.g. it correctly fixed migration 092's
        # stocktakes). It does nothing for profiles/organizations/warehouses/
        # distribution_points — created EARLIER, inside 001 itself — because
        # ALTER DEFAULT PRIVILEGES only governs FUTURE object creation, never
        # retroactively grants on existing objects. Confirmed by the actual
        # browser-side error this produced: "permission denied for table
        # profiles (SQLSTATE 42501), hint: GRANT SELECT ON public.profiles TO
        # authenticated" — a genuine missing table-level GRANT (not RLS row
        # filtering, which fails silently with an empty result instead).
        # Fixed by PREPENDING instead, so it's in effect before 001's own
        # first CREATE TABLE. Mirrors tools/pg-rig/bootstrap.sql's identical
        # statements, applied to this ephemeral runner's disposable checkout
        # only — the committed migration file is never modified.
        run: |
          {
            echo "-- E2E-CI-ONLY (prepended to this ephemeral checkout's copy"
            echo "-- of 001 only — never committed). Mirrors"
            echo "-- tools/pg-rig/bootstrap.sql's identical statements, run"
            echo "-- BEFORE any table exists so every table this repo's"
            echo "-- migrations create — including 001's own — inherits it."
            echo "-- E2E-ANON-PLATFORM-NORMALIZATION"
            echo "-- The local Supabase CLI provisions public-schema default ACLs that"
            echo "-- grant the client-facing roles far more than either Production or"
            echo "-- tools/pg-rig/bootstrap.sql does. RE-MEASURED on a pristine stack"
            echo "-- with ZERO Phoenix migrations (CLI 2.116.0, postgres 17.6.1.165 —"
            echo "-- the exact images CI resolves today):"
            echo "--   postgres | public | table    | anon | arwdDxtm"
            echo "--   postgres | public | FUNCTION | {postgres, anon, authenticated, service_role} = EXECUTE"
            echo "-- Neither Production nor tools/pg-rig/bootstrap.sql has either row:"
            echo "-- Production's verified contract is ANON_PUBLIC_RELATION_PRIVILEGES = {},"
            echo "-- and the rig models a FUNCTION default for service_role ONLY."
            echo "-- Left in place, every object created before migration 109 inherits"
            echo "-- these at CREATE time; 109 removes the defaults but cannot act"
            echo "-- retroactively, and 108 only clears 15 tables."
            echo "-- Normalize the PLATFORM here rather than patching Phoenix objects"
            echo "-- afterwards: exact owner (postgres), exact scope (schema public),"
            echo "-- exact principals, exact measured privilege lists, REVOKE only."
            echo "--"
            echo "-- TABLES. The privilege list is the full measured arwdDxtm. An earlier"
            echo "-- revision named only MAINTAIN/REFERENCES/TRIGGER/TRUNCATE and recorded"
            echo "-- that the CLI default 'never granted SELECT/INSERT/UPDATE/DELETE to"
            echo "-- anon'. That was true of the older platform and is now FALSE: the"
            echo "-- measured default is arwdDxtm, so the four-privilege revoke left anon"
            echo "-- holding INSERT/SELECT/UPDATE/DELETE on every pre-109 table and"
            echo "-- migration 191 fail-closed with 'anon holds a direct SELECT on a"
            echo "-- topology table'. Reproduced and fixed in a disposable full replay."
            echo "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE INSERT, SELECT, UPDATE, DELETE, MAINTAIN, REFERENCES, TRIGGER, TRUNCATE ON TABLES FROM anon;"
            echo "-- FUNCTIONS. anon and authenticated only; service_role is untouched and"
            echo "-- keeps the EXECUTE default granted below. Both principals are proven"
            echo "-- divergent, each by a different migration failing closed on it:"
            echo "--   * anon          -> migration 045's own VERIFY aborts P0004 with"
            echo "--     'anon must NOT have EXECUTE on phoenix_update_my_whatsapp_phone'."
            echo "--     045 REVOKEs FROM PUBLIC, which cannot remove a DIRECT anon grant."
            echo "--   * authenticated -> migration 109's lockdown VERIFY aborts P0004 with"
            echo "--     'default-privilege lockdown incomplete: ... still grants EXECUTE"
            echo "--     to authenticated' (its check names authenticated, anon and PUBLIC)."
            echo "-- 109 cannot clear either itself: it revokes function defaults at GLOBAL"
            echo "-- scope (the only scope Postgres honours when no schema-scoped row"
            echo "-- exists — see 109's own quirk note), while this platform provisions a"
            echo "-- SCHEMA-scoped row. The two scopes never intersect, so the schema-"
            echo "-- scoped row survives 109 untouched. EXECUTE only; no REVOKE ALL."
            echo "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public REVOKE EXECUTE ON FUNCTIONS FROM anon, authenticated;"
            echo "-- E2E-PLATFORM-BASELINE-MIRROR (keep in sync with tools/pg-rig/bootstrap.sql)"
            echo "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES    TO authenticated, service_role;"
            echo "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO authenticated, service_role;"
            echo "-- H-23: the two platform facts this mirror used to omit. Without"
            echo "-- them no function created before migration 109 inherits the"
            echo "-- service_role EXECUTE that Production grants (315/349), and"
            echo "-- migration 194 correctly fail-closes on its service_role"
            echo "-- precondition. Measured from Production, not assumed."
            echo "GRANT CREATE ON SCHEMA public TO service_role;"
            echo "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO service_role;"
            echo ""
            cat supabase/migrations/001_phoenix_core_schema.sql
          } > /tmp/001_prepended.sql
          mv /tmp/001_prepended.sql supabase/migrations/001_phoenix_core_schema.sql

      - name: Seed the pre-062 super_admin migration 062 requires to exist (mirrors tools/pg-rig/rig.mjs's SEED_AFTER_001)
        # Migration 062 aborts if no super_admin profile exists yet — rig.mjs
        # documents this exact requirement and seeds a fixed-UUID super_admin
        # immediately after migration 001 creates the profiles table, for
        # every fresh 001->latest replay it does. `supabase start` has no
        # hook to run SQL between two specific migrations, and a SEPARATE
        # migration file for this was tried first but does not work: the
        # Supabase CLI requires a purely-numeric "<timestamp>_name.sql"
        # filename and silently SKIPPED a "001z_..." file entirely (visible
        # in an earlier run's log: "Skipping migration
        # 001z_e2e_ci_seed_super_admin_for_062.sql... (file name must match
        # pattern...)") — and no purely-numeric prefix can lexically sort
        # between "001_" and "002_" anyway (any extra digit after "001"
        # sorts BEFORE the "_" that follows "001" in the real file, since
        # digits < '_' in ASCII). So instead this APPENDS the seed SQL
        # directly onto the end of migration 001's own file content, in this
        # ephemeral runner's disposable checkout only (never committed) —
        # guarantees it runs in the same migration step as 001 itself, right
        # after the profiles table exists, with no filename/ordering tricks.
        run: |
          cat >> supabase/migrations/001_phoenix_core_schema.sql <<'SQL'

          -- E2E-CI-ONLY seed (appended to this ephemeral checkout's copy of
          -- 001 only — never committed): a disposable synthetic super_admin
          -- migration 062 requires to exist for a fresh replay to pass its
          -- own verification. Mirrors tools/pg-rig/rig.mjs's SEED_AFTER_001.
          INSERT INTO auth.users (id, email, raw_user_meta_data)
          VALUES ('00000000-0000-0000-0000-e2ec105eeda1',
                   'e2e-ci-seed-super-admin@phoenix.local',
                   jsonb_build_object('full_name','E2E CI Seed Super Admin','role','super_admin'))
          ON CONFLICT (id) DO NOTHING;
          UPDATE public.profiles SET role='super_admin', status='active'
           WHERE id='00000000-0000-0000-0000-e2ec105eeda1';
          SQL

      - name: Start local Supabase (applies supabase/migrations/001->latest automatically)
        run: supabase start

      - name: Capture local Supabase connection info
        id: sb
        run: |
          supabase status -o json > /tmp/sb-status.json
          echo "supabase status JSON keys: $(node -pe "Object.keys(require('/tmp/sb-status.json')).join(', ')")"
          {
            echo "api_url=$(node -pe "require('/tmp/sb-status.json').API_URL")"
            echo "anon_key=$(node -pe "require('/tmp/sb-status.json').ANON_KEY")"
          } >> "$GITHUB_OUTPUT"
          node -pe "require('/tmp/sb-status.json').SERVICE_ROLE_KEY" > /tmp/sb-service-role-key.txt
          node -pe "require('/tmp/sb-status.json').DB_URL" > /tmp/sb-db-url.txt

      - name: Confirm migration ceiling reached 152 (not silently short)
        run: |
          RESULT=$(node -e "
            const { Client } = require('pg');
            (async () => {
              const c = new Client({ connectionString: require('fs').readFileSync('/tmp/sb-db-url.txt', 'utf8').trim() });
              await c.connect();
              const r = await c.query(\"SELECT count(*)::int n FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname='public' AND p.proname IN ('phoenix_dispense_outlet_stock_with_context','phoenix_get_inventory_suggestion_actions')\");
              await c.end();
              console.log(r.rows[0].n);
            })();
          ")
          if [ "$RESULT" != "2" ]; then
            echo "::error::migration 152 read model or its migration-136 dispense prerequisite is missing — supabase start did not reach the expected migration ceiling"
            exit 1
          fi
          echo "Migration ceiling confirmed: 152 read model and 136 dispense prerequisite present."

      - name: Verify the M085 / M194 authorization boundary in the disposable stack
        # M085-M194-E2E-SECURITY-PROOF
        # Read-only. Proves the disposable stack actually reproduces the
        # Production authorization posture this PR converges on — rather than
        # merely starting without error — and that the ephemeral 085
        # attestation did NOT leak beyond its own transaction. Runs on a NEW
        # connection, after every migration has committed.
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const { readFileSync } = require('node:fs');

          const UPSERT = 'public.phoenix_upsert_availability(uuid,text,text,text,text,integer,text,date,text,text,text,numeric,text)';
          const MOVEMENT = 'public.phoenix_apply_availability_movement(uuid,text,integer,text,text)';
          const fail = (m) => { console.error(`::error::${m}`); process.exitCode = 1; };

          (async () => {
            const c = new Client({ connectionString: readFileSync('/tmp/sb-db-url.txt', 'utf8').trim() });
            await c.connect();

            // 1. The attestation must NOT be visible on a fresh connection.
            const leak = await c.query("SELECT current_setting('phoenix.availability_cutover_attested', true) AS v");
            const v = leak.rows[0].v;
            if (v !== null && v !== '' && v !== 'false') {
              fail(`085 attestation leaked beyond its transaction: current_setting = ${JSON.stringify(v)}`);
            } else {
              console.log('attestation leak check: OK (not set on a new connection)');
            }

            // 2. M085's security boundary is LIVE.
            for (const sig of [UPSERT, MOVEMENT]) {
              const r = await c.query(
                `SELECT has_function_privilege('authenticated', $1::regprocedure, 'EXECUTE') AS auth_exec,
                        has_function_privilege('service_role',  $1::regprocedure, 'EXECUTE') AS svc_exec`, [sig]);
              const { auth_exec, svc_exec } = r.rows[0];
              if (auth_exec !== false) fail(`M085 boundary missing: authenticated can EXECUTE ${sig}`);
              if (svc_exec !== true) fail(`service_role lost EXECUTE on ${sig}`);
            }
            console.log('M085 writer boundary: authenticated NO / service_role YES on both writers');

            // 3. M194's converged authenticated direct-write surface.
            const writes = await c.query(`
              SELECT c.relname || ' ' || pr.p AS tuple
                FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                CROSS JOIN (SELECT unnest(ARRAY['INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER','MAINTAIN']) AS p) pr
               WHERE n.nspname = 'public' AND c.relkind IN ('r','v','m','p','f')
                 AND NOT EXISTS (SELECT 1 FROM pg_depend d
                                  WHERE d.classid='pg_class'::regclass AND d.objid=c.oid AND d.deptype='e')
                 AND has_table_privilege('authenticated', c.oid, pr.p)
               ORDER BY 1`);
            const actual = writes.rows.map((r) => r.tuple);
            const expected = [
              'distribution_points INSERT', 'distribution_points UPDATE',
              'organizations INSERT', 'organizations UPDATE',
            ];
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              fail(`M194 authenticated direct-write surface is ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`);
            } else {
              console.log('M194 authenticated direct-write surface: exactly the contracted 4 tuples');
            }

            // 3b. anon holds NO public relation privilege at all. Production's
            //     verified contract is ANON_PUBLIC_RELATION_PRIVILEGES = {};
            //     the local CLI platform default would otherwise leave 81
            //     inherited tuples here (MAINTAIN/REFERENCES/TRIGGER/TRUNCATE).
            const anonRel = await c.query(`
              SELECT c.relname || ' ' || pr.p AS tuple
                FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                CROSS JOIN (SELECT unnest(ARRAY['SELECT','INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER','MAINTAIN']) AS p) pr
               WHERE n.nspname = 'public' AND c.relkind IN ('r','v','m','p','f')
                 AND NOT EXISTS (SELECT 1 FROM pg_depend d
                                  WHERE d.classid='pg_class'::regclass AND d.objid=c.oid AND d.deptype='e')
                 AND has_table_privilege('anon', c.oid, pr.p)
               ORDER BY 1`);
            if (anonRel.rows.length !== 0) {
              fail(`anon holds ${anonRel.rows.length} public relation privileges (expected none): ` +
                JSON.stringify(anonRel.rows.slice(0, 12).map((r) => r.tuple)));
            } else {
              console.log('anon public relation privileges: {}');
            }

            // 4. MAINTAIN is fully converged.
            const maintain = await c.query(`
              SELECT count(*)::int AS n
                FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
               WHERE n.nspname='public' AND c.relkind IN ('r','v','m','p','f')
                 AND NOT EXISTS (SELECT 1 FROM pg_depend d
                                  WHERE d.classid='pg_class'::regclass AND d.objid=c.oid AND d.deptype='e')
                 AND has_table_privilege('authenticated', c.oid, 'MAINTAIN')`);
            if (maintain.rows[0].n !== 0) fail(`authenticated MAINTAIN relations = ${maintain.rows[0].n}, expected 0`);
            else console.log('authenticated MAINTAIN relations: 0');

            await c.end();
          })().catch((e) => { console.error(`::error::${e.message}`); process.exit(1); });
          NODE

      - name: Seed disposable fixtures (orgs, real Auth users, outlet stock — never Production)
        env:
          SUPABASE_URL: ${{ steps.sb.outputs.api_url }}
          E2E_SEED_OUTPUT_PATH: e2e-seed.json
        run: |
          SUPABASE_SERVICE_ROLE_KEY="$(cat /tmp/sb-service-role-key.txt)"
          DATABASE_URL="$(cat /tmp/sb-db-url.txt)"
          export SUPABASE_SERVICE_ROLE_KEY DATABASE_URL
          node tools/e2e-fixtures/seed.mjs

      - name: Build production bundle against the local Supabase instance
        env:
          VITE_PHOENIX_SUPABASE_URL: ${{ steps.sb.outputs.api_url }}
          VITE_PHOENIX_SUPABASE_ANON_KEY: ${{ steps.sb.outputs.anon_key }}
          VITE_PHOENIX_BATCH_IDENTITY_051_ENABLED: "true"
          VITE_PHOENIX_SCOPED_RBAC_MODE: "off"
        run: npm run build

      - name: Serve the built app
        run: |
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173 >/dev/null || { echo "::error::preview server never became ready"; cat /tmp/vite-preview.log; exit 1; }

      - name: Run authenticated browser acceptance (including Phase 8)
        run: node tools/e2e-acceptance/run.mjs http://127.0.0.1:4173 e2e-seed.json

      - name: Stop preview server
        if: always()
        run: kill "$(cat /tmp/vite-preview.pid)" 2>/dev/null || true

      - name: Upload acceptance screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-authenticated-acceptance-evidence
          path: docs/phoenix/e2e-acceptance/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local Supabase (disposable state — nothing persists)
        if: always()
        run: supabase stop --no-backup
