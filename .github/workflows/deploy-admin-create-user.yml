name: '[DEPRECATED — APPLIES MIGRATIONS] Deploy secure admin user provisioning'

# ############################################################################
# DEPRECATED. Do NOT use this to deploy the admin-create-user Edge Function.
#
# Use instead: deploy-admin-create-user-function-only.yml
#
# WHY
#   This workflow runs `supabase db push` against Production BEFORE it deploys
#   the function. That push is UNBOUNDED — the ACCEPTED_MIGRATION_CEILING value
#   declared below is never passed to the command, so it applies whatever
#   migrations are pending at the moment it runs, not "migrations through 146".
#
#   Deploying one Edge Function must never carry the authority to apply an
#   unrelated migration. At the time of writing nothing is pending (master and
#   the Production ceiling are both 184), but the hazard goes live the instant a
#   reviewed-but-unapplied migration lands on master — which is exactly what the
#   open R1.5 stage will do.
#
#   This workflow is therefore PERMANENTLY DISABLED. Its first step always
#   fails, unconditionally. There is no input, no confirmation phrase and no
#   acknowledgement that can reach the steps below it — an escape hatch that
#   can be typed is an escape hatch that will be typed.
#
#   The historical steps are RETAINED BELOW, unreachable, so the audit trail of
#   what this workflow used to do stays readable in one place.
# ############################################################################

# workflow_dispatch is retained so the workflow stays visible in the Actions
# list and an operator who reaches for it receives the explicit redirect below
# rather than silence. It takes NO inputs: there is nothing to fill in, because
# nothing can proceed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-secure-user-provisioning
  cancel-in-progress: false

env:
  PROJECT_REF: eyrzxgfkvqybjdgyphap
  ACCEPTED_MIGRATION_CEILING: '146'

jobs:
  deploy:
    name: PERMANENTLY DISABLED — use the function-only workflow
    runs-on: ubuntu-latest
    environment: production
    steps:
      # UNCONDITIONAL. No `if`, no input, no phrase, no override. Every run of
      # this workflow ends here. Every step after it is unreachable and is kept
      # only so the audit trail of the historical procedure stays readable.
      - name: Refuse — this workflow is permanently deprecated
        run: |
          echo "::error::This workflow is permanently deprecated. Use deploy-admin-create-user-function-only.yml."
          echo "::error::It ran an unbounded 'supabase db push' before deploying, so it could apply unrelated pending migrations to Production."
          echo "::error::Deploying one Edge Function must never carry authority to apply a migration."
          exit 1

      - name: Verify explicit Production authorization
        run: |
          if [ "${{ github.ref_name }}" != "master" ]; then
            echo "::error::This deployment may run from master only."
            exit 1
          fi
          if [ "${{ github.sha }}" != "${{ inputs.confirm_sha }}" ]; then
            echo "::error::SHA mismatch. Refusing to deploy an unintended commit."
            exit 1
          fi
          if [ "${{ inputs.confirmation }}" != "DEPLOY_SECURE_USER_PROVISIONING" ]; then
            echo "::error::Confirmation phrase mismatch."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets are configured
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$PHOENIX_PRODUCTION_DATABASE_URL" ]; then
            echo "::error::PHOENIX_PRODUCTION_DATABASE_URL is not configured."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Production preflight (read-only)
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: node tools/phoenix-demo/prod-preflight.mjs

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0

      - name: Preview migration plan (read-only)
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: supabase db push --db-url "$PHOENIX_PRODUCTION_DATABASE_URL" --dry-run

      - name: Apply accepted migrations through 146
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: supabase db push --db-url "$PHOENIX_PRODUCTION_DATABASE_URL"

      - name: Verify contiguous Production history reaches 146
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: node tools/phoenix-demo/verify-migration-ceiling.mjs

      - name: Deploy admin-create-user only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-create-user --project-ref "$PROJECT_REF"
