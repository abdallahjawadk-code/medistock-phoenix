name: Deploy secure admin user provisioning

# Manually deploys exactly the account-provisioning fix:
#   1. read-only Production preflight;
#   2. migration preview;
#   3. accepted migrations through 146;
#   4. migration-history verification;
#   5. admin-create-user Edge Function only.
#
# It cannot purge data, seed data, accept arbitrary SQL/project refs, or deploy
# any other Edge Function. GitHub's Production environment remains the final
# approval boundary.

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: 'Exact master commit SHA to deploy'
        required: true
        type: string
      confirmation:
        description: 'Type DEPLOY_SECURE_USER_PROVISIONING exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-secure-user-provisioning
  cancel-in-progress: false

env:
  PROJECT_REF: eyrzxgfkvqybjdgyphap
  ACCEPTED_MIGRATION_CEILING: '146'

jobs:
  deploy:
    name: Apply migration 146 and deploy admin-create-user
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify explicit Production authorization
        run: |
          if [ "${{ github.ref_name }}" != "master" ]; then
            echo "::error::This deployment may run from master only."
            exit 1
          fi
          if [ "${{ github.sha }}" != "${{ inputs.confirm_sha }}" ]; then
            echo "::error::SHA mismatch. Refusing to deploy an unintended commit."
            exit 1
          fi
          if [ "${{ inputs.confirmation }}" != "DEPLOY_SECURE_USER_PROVISIONING" ]; then
            echo "::error::Confirmation phrase mismatch."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets are configured
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$PHOENIX_PRODUCTION_DATABASE_URL" ]; then
            echo "::error::PHOENIX_PRODUCTION_DATABASE_URL is not configured."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Production preflight (read-only)
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: node tools/phoenix-demo/prod-preflight.mjs

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0

      - name: Preview migration plan (read-only)
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: supabase db push --db-url "$PHOENIX_PRODUCTION_DATABASE_URL" --dry-run

      - name: Apply accepted migrations through 146
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: supabase db push --db-url "$PHOENIX_PRODUCTION_DATABASE_URL"

      - name: Verify contiguous Production history reaches 146
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: node tools/phoenix-demo/verify-migration-ceiling.mjs

      - name: Deploy admin-create-user only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-create-user --project-ref "$PROJECT_REF"
