name: Deploy admin-create-user (function only)

# Deploys EXACTLY ONE Edge Function — admin-create-user — and nothing else.
#
# WHY THIS EXISTS ALONGSIDE deploy-admin-create-user.yml
#   The older workflow runs `supabase db push` against Production before it
#   deploys. That is unbounded: it applies whatever migrations are pending, and
#   the `ACCEPTED_MIGRATION_CEILING` env var it declares is never passed to the
#   command. Deploying one Edge Function must never carry the authority to apply
#   an unrelated migration, no matter what the ceiling happens to be on the day.
#   This workflow therefore touches no migration state at all.
#
# WHAT IT DELIBERATELY DOES NOT DO
#   * no `supabase db push`, no `supabase migration ...`, no `db reset`
#   * no SQL of any kind against the Production database
#   * no other Edge Function — the function name is a literal, not an input
#   * no `--no-verify-jwt`, so JWT verification stays enabled
#
# GitHub's `production` environment remains the final approval boundary, and the
# deployed artifact is pinned by SHA-256 to the reviewed repository file.

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: 'Exact master commit SHA to deploy'
        required: true
        type: string
      confirm_file_sha256:
        description: 'SHA-256 of supabase/functions/admin-create-user/index.ts'
        required: true
        type: string
      confirmation:
        description: 'Type DEPLOY_ADMIN_CREATE_USER_FUNCTION_ONLY exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-secure-user-provisioning
  cancel-in-progress: false

env:
  PROJECT_REF: eyrzxgfkvqybjdgyphap
  FUNCTION_NAME: admin-create-user

jobs:
  deploy:
    name: Deploy admin-create-user only
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify explicit Production authorization
        run: |
          if [ "${{ github.ref_name }}" != "master" ]; then
            echo "::error::This deployment may run from master only."
            exit 1
          fi
          if [ "${{ github.sha }}" != "${{ inputs.confirm_sha }}" ]; then
            echo "::error::SHA mismatch. Refusing to deploy an unintended commit."
            exit 1
          fi
          if [ "${{ inputs.confirmation }}" != "DEPLOY_ADMIN_CREATE_USER_FUNCTION_ONLY" ]; then
            echo "::error::Confirmation phrase mismatch."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Pin the artifact to the reviewed file
        run: |
          f="supabase/functions/${FUNCTION_NAME}/index.ts"
          actual="$(sha256sum "$f" | cut -d' ' -f1)"
          echo "candidate sha256: $actual"
          if [ "$actual" != "${{ inputs.confirm_file_sha256 }}" ]; then
            echo "::error::index.ts SHA-256 mismatch — refusing to deploy an unreviewed artifact."
            echo "::error::expected ${{ inputs.confirm_file_sha256 }}, found $actual"
            exit 1
          fi

      - name: Verify the facility-scoped contract is present
        run: |
          f="supabase/functions/${FUNCTION_NAME}/index.ts"
          for token in health_center_manager FACILITY_SCOPED_ROLES \
                       facility_ids phoenix_admin_assign_facility_scopes; do
            if ! grep -q "$token" "$f"; then
              echo "::error::$f is missing $token — this is the stale contract."
              exit 1
            fi
          done

      - name: Verify required secret is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0

      - name: Deploy admin-create-user only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF"
