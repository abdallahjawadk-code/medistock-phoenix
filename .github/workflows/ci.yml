name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security and quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check
        run: npm run typecheck

      - name: Prepare CI-only local guard fixtures
        run: |
          install -m 600 /dev/null premium-preview.html
          git config user.name "MediStock CI"
          git config user.email "ci@users.noreply.github.com"
          printf '\n' >> SECURITY.md
          git add SECURITY.md
          git stash push -m "paused Service-D inter-org exchange service work" -- SECURITY.md
          git status --porcelain --untracked-files=no | grep -q '^' && exit 1 || true

      - name: Run tests
        run: npm test
        env:
          TZ: Asia/Baghdad

      - name: Lint with the established warning baseline
        run: npm run lint -- --max-warnings 4

      - name: Build production bundle
        run: npm run build
        env:
          VITE_PHOENIX_SUPABASE_URL: https://example.supabase.co
          VITE_PHOENIX_SUPABASE_ANON_KEY: ci-public-anon-placeholder
          VITE_PHOENIX_BATCH_IDENTITY_051_ENABLED: "true"
          VITE_PHOENIX_SCOPED_RBAC_MODE: "off"

      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8'))"

  pg-rig:
    name: PostgreSQL pg-rig
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # tools/pg-rig/rig.mjs replays the FULL canonical chain (001..latest,
      # minus PREPARED_ONLY_SKIP) against a throwaway `phoenix_rig` database on
      # THIS service container only — never a Supabase/production credential.
      - name: Replay migrations 001->latest onto the disposable rig
        run: node tools/pg-rig/apply.mjs
        env:
          PHOENIX_RIG_PG: postgres://postgres@localhost:55432/postgres

      # Every dynamic suite calls buildRig(), which drops and recreates the
      # SAME 'phoenix_rig' database name (tools/pg-rig/rig.mjs) — running two
      # suites at once would race on that drop/recreate. --fileParallelism=false
      # keeps suite files strictly serial; --pool=forks --poolOptions.forks.singleFork
      # additionally pins everything to one worker process, matching how this
      # rig has only ever been exercised locally (see the dynamic tests' own
      # PHOENIX_RIG_PG usage comments).
      # vitest's CLI filter argument is a plain substring/regex match against
      # normalized file paths, NOT a glob — a quoted "**/*.dynamic.test.ts"
      # pattern matches nothing ("No test files found", exit 1) and this step
      # silently ran zero tests until this fix. "dynamic.test.ts" as a bare
      # substring matches every *.dynamic.test.ts file under the repo, which
      # is exactly and only supabase/migrations/__tests__/*.dynamic.test.ts.
      - name: Run *.dynamic.test.ts suites against the disposable rig (serial)
        run: >-
          npx vitest run "dynamic.test.ts"
          --fileParallelism=false --pool=forks --poolOptions.forks.singleFork
        env:
          PHOENIX_RIG_PG: postgres://postgres@localhost:55432/postgres
          TZ: Asia/Baghdad

      # ══════════════════════════════════════════════════════════════════════
      # MIXED-HISTORY / SHADOW-WORKSPACE ACCEPTANCE.
      #
      # Production's supabase_migrations.schema_migrations is NOT this
      # repository's canonical numbering: 172 three-digit versions, then
      # 14-digit Supabase CLI timestamps. The Production executor therefore
      # reconciles the two namespaces and pushes from a temporary shadow
      # workspace. That machinery is only trustworthy if it is exercised
      # against the real shape, so it runs here — inside a REQUIRED check, not
      # as an advisory job — against a throwaway PostgreSQL created for this
      # job and destroyed with the runner.
      #
      # The server is TLS-ONLY for TCP: there is no plaintext `host` rule, so
      # if the CLI connects at all the connection is TLS. That is asked of the
      # server via pg_stat_ssl rather than inferred from configuration text.
      # ══════════════════════════════════════════════════════════════════════
      - name: Generate ephemeral TLS material for the acceptance database
        run: |
          set -euo pipefail
          mkdir -p /tmp/tlspg
          # The SANs and CA:TRUE are load-bearing. node-postgres 8.22 resolves
          # `sslmode=require` to VERIFY-FULL semantics, so the acceptance's own
          # connections validate this certificate and check the host against it
          # rather than skipping the check. It is trusted for this job alone via
          # NODE_EXTRA_CA_CERTS below, and is discarded with the runner.
          openssl req -new -x509 -days 1 -nodes -text \
            -out /tmp/tlspg/server.crt -keyout /tmp/tlspg/server.key \
            -subj "/CN=phoenix-acceptance" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost,DNS:phoenix-acceptance" \
            -addext "basicConstraints=critical,CA:TRUE" 2>/dev/null
          cat > /tmp/tlspg/pg_hba.conf <<'HBA'
          # Unix socket only for the container's own startup/healthcheck.
          local   all   all                 trust
          # TCP is hostssl ONLY — no plaintext equivalent for any principal.
          hostssl all   all   0.0.0.0/0     md5
          hostssl all   all   ::/0          md5
          HBA
          sudo chown 999:999 /tmp/tlspg/server.key /tmp/tlspg/server.crt /tmp/tlspg/pg_hba.conf
          sudo chmod 600 /tmp/tlspg/server.key
          echo "ephemeral TLS material generated (1-day self-signed, discarded with the runner)"

      - name: Start the TLS-only disposable PostgreSQL 17
        run: |
          set -euo pipefail
          docker run -d --name phoenix-tlspg \
            -e POSTGRES_PASSWORD=acceptance \
            -e POSTGRES_DB=acceptance \
            -p 55433:5432 \
            -v /tmp/tlspg:/tls:ro \
            postgres:17 \
            -c ssl=on \
            -c ssl_cert_file=/tls/server.crt \
            -c ssl_key_file=/tls/server.key \
            -c hba_file=/tls/pg_hba.conf
          for i in $(seq 1 60); do
            if docker exec phoenix-tlspg pg_isready -U postgres -d acceptance >/dev/null 2>&1; then
              echo "acceptance database ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::the TLS-only acceptance database never became ready"
          docker logs phoenix-tlspg | tail -40
          exit 1

      - name: Prove the acceptance database refuses plaintext TCP
        run: |
          set -uo pipefail
          # sslmode=disable must be rejected: there is no `host` rule, only hostssl.
          if PGPASSWORD=acceptance psql "postgresql://postgres@127.0.0.1:55433/acceptance?sslmode=disable" \
            -c 'SELECT 1' >/dev/null 2>&1; then
            echo "::error::plaintext TCP succeeded — the acceptance server is not TLS-only"
            exit 1
          fi
          echo "plaintext TCP refused, as required"

      - name: Set up the pinned Supabase CLI for acceptance
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      # Migration 197 is REAL SQL: it GRANTs and REVOKEs EXECUTE on named
      # functions with no IF EXISTS guard, and opens with a DO $m197_pre$
      # precondition block. Pushed at an empty database it would abort on the
      # first missing function, so the acceptance database first receives the
      # canonical chain 001->196 — the same replay, and the same tooling, the
      # required rig step above already uses. Only then does the shadow-
      # workspace push of 197 mean what Production will mean.
      - name: Replay migrations 001->196 onto the TLS-only acceptance database
        env:
          PHOENIX_RIG_PG: postgresql://postgres:acceptance@127.0.0.1:55433/postgres?sslmode=require
          PHOENIX_RIG_DB: acceptance_rig
          NODE_EXTRA_CA_CERTS: /tmp/tlspg/server.crt
        run: node tools/pg-rig/apply.mjs 196

      - name: Mixed-history / shadow-workspace acceptance (TLS-only, disposable)
        env:
          ACCEPTANCE_DB_URL: postgresql://postgres:acceptance@127.0.0.1:55433/acceptance_rig?sslmode=require
          ACCEPTANCE_CLI_VERSION: 2.115.0
          NODE_EXTRA_CA_CERTS: /tmp/tlspg/server.crt
        run: node tools/phoenix-demo/mixed-history-acceptance.mjs

      - name: Tear down the acceptance database
        if: always()
        run: docker rm -f phoenix-tlspg >/dev/null 2>&1 || true
