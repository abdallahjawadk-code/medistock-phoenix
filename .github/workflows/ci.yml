name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security and quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check
        run: npm run typecheck

      - name: Prepare CI-only local guard fixtures
        run: |
          install -m 600 /dev/null premium-preview.html
          git config user.name "MediStock CI"
          git config user.email "ci@users.noreply.github.com"
          printf '\n' >> SECURITY.md
          git add SECURITY.md
          git stash push -m "paused Service-D inter-org exchange service work" -- SECURITY.md
          git status --porcelain --untracked-files=no | grep -q '^' && exit 1 || true

      - name: Run tests
        run: npm test
        env:
          TZ: Asia/Baghdad

      - name: Lint with the established warning baseline
        run: npm run lint -- --max-warnings 4

      - name: Build production bundle
        run: npm run build
        env:
          VITE_PHOENIX_SUPABASE_URL: https://example.supabase.co
          VITE_PHOENIX_SUPABASE_ANON_KEY: ci-public-anon-placeholder
          VITE_PHOENIX_BATCH_IDENTITY_051_ENABLED: "true"
          VITE_PHOENIX_SCOPED_RBAC_MODE: "off"

      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8'))"
