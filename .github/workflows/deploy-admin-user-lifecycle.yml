name: Deploy secure admin user lifecycle

# Manually deploys exactly two account-lifecycle Edge Functions:
#   - admin-user-lifecycle  (disable / enable / rotate_password / delete)
#   - admin-recycle-user    (recycle a suspended account)
#
# Both already delegate every authority decision and profile state transition
# to the atomic migration-093/147 contract (phoenix_lifecycle_* /
# phoenix_recycle_apply / phoenix_profile_operational_blockers). The hard-
# delete path now depends on migration 147 (SECURE-USER-DELETE-HISTORY-
# GUARD-147), which is NOT yet applied to Production — deploying the
# Edge Functions without it would let a delete attempt reach a
# phoenix_lifecycle_reserve that has no operational-history gate at all.
# This workflow therefore applies EXACTLY migration 147 (resume-safe: a
# skip if Production already has it) before deploying, and fails closed on
# any other Production migration state. It cannot purge/seed data, apply any
# migration other than 147, accept arbitrary SQL/project refs, or deploy any
# other Edge Function. GitHub's Production environment remains the final
# approval boundary.

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: 'Exact master commit SHA to deploy'
        required: true
        type: string
      confirmation:
        description: 'Type DEPLOY_SECURE_USER_LIFECYCLE exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-secure-user-lifecycle
  cancel-in-progress: false

env:
  PROJECT_REF: eyrzxgfkvqybjdgyphap
  LOCAL_MIGRATION_CEILING: '147'

jobs:
  deploy:
    name: Apply migration 147 (if needed) and deploy admin-user-lifecycle / admin-recycle-user
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify explicit Production authorization
        run: |
          if [ "${{ github.ref_name }}" != "master" ]; then
            echo "::error::This deployment may run from master only."
            exit 1
          fi
          if [ "${{ github.sha }}" != "${{ inputs.confirm_sha }}" ]; then
            echo "::error::SHA mismatch. Refusing to deploy an unintended commit."
            exit 1
          fi
          if [ "${{ inputs.confirmation }}" != "DEPLOY_SECURE_USER_LIFECYCLE" ]; then
            echo "::error::Confirmation phrase mismatch."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets are configured
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$PHOENIX_PRODUCTION_DATABASE_URL" ]; then
            echo "::error::PHOENIX_PRODUCTION_DATABASE_URL is not configured."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Verify this checkout's own migration ceiling is exactly 147
        run: |
          highest=$(ls supabase/migrations | grep -oE '^[0-9]{3}' | sort -n | tail -1)
          if [ "$highest" != "$LOCAL_MIGRATION_CEILING" ]; then
            echo "::error::This checkout's migration ceiling is $highest, expected exactly $LOCAL_MIGRATION_CEILING. Refusing to proceed — deploying against an unexpected local migration set could apply the wrong set to Production."
            exit 1
          fi
          echo "Local migration ceiling confirmed: $highest"

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0

      - name: Read Production's current migration ceiling (read-only)
        id: read_ceiling
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: node tools/phoenix-demo/read-migration-ceiling.mjs

      - name: Fail closed unless Production is at 146 (needs 147) or already at 147 (resume-safe)
        run: |
          c="${{ steps.read_ceiling.outputs.ceiling }}"
          if [ "$c" != "146" ] && [ "$c" != "147" ]; then
            echo "::error::Production migration ceiling is $c. This workflow only knows how to proceed from exactly 146 (apply migration 147) or 147 (already applied, resume-safe). Any other value is an unexplained divergence — refusing to deploy anything."
            exit 1
          fi
          echo "Production ceiling is $c — proceeding."

      - name: Preview migration 147 (read-only dry-run)
        if: steps.read_ceiling.outputs.ceiling == '146'
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: supabase db push --db-url "$PHOENIX_PRODUCTION_DATABASE_URL" --dry-run

      - name: Apply migration 147 only
        if: steps.read_ceiling.outputs.ceiling == '146'
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: supabase db push --db-url "$PHOENIX_PRODUCTION_DATABASE_URL"

      - name: Verify Production migration history now reaches 147
        if: steps.read_ceiling.outputs.ceiling == '146'
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
          ACCEPTED_MIGRATION_CEILING: '147'
        run: node tools/phoenix-demo/verify-migration-ceiling.mjs

      - name: Verify delete-history-guard security contract (read-only)
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: node tools/phoenix-demo/verify-delete-history-guard-contract.mjs

      - name: Deploy admin-user-lifecycle only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-user-lifecycle --project-ref "$PROJECT_REF"

      - name: Deploy admin-recycle-user only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-recycle-user --project-ref "$PROJECT_REF"
