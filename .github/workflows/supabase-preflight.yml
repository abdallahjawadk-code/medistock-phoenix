name: Supabase protected preflight

on:
  workflow_dispatch:
    inputs:
      target:
        description: GitHub Environment containing the target Supabase credentials
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      expected_head_sha:
        description: Exact 40-character master SHA to inspect
        required: true
        type: string
      confirmation:
        description: Type READ-ONLY-PREFLIGHT
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-${{ inputs.target }}-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only Supabase preflight (${{ inputs.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: supabase-${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate protected invocation
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::This workflow may run only from master."
            exit 1
          fi

          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_head_sha must be an exact lowercase 40-character SHA."
            exit 1
          fi

          if [[ "$EXPECTED_HEAD_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::The requested SHA does not match the checked-out master SHA."
            exit 1
          fi

          if [[ "$CONFIRMATION" != "READ-ONLY-PREFLIGHT" ]]; then
            echo "::error::Confirmation text does not match READ-ONLY-PREFLIGHT."
            exit 1
          fi

          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is not configured in supabase-${TARGET}."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Verify pinned Supabase CLI
        run: npx --yes supabase@2.109.1 --version

      - name: Link ephemeral runner to selected project
        run: npx --yes supabase@2.109.1 link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show local and remote migration history
        run: npx --yes supabase@2.109.1 migration list --linked

      - name: Detect pending migrations without applying them
        run: npx --yes supabase@2.109.1 db push --linked --dry-run

      - name: Confirm read-only completion
        run: |
          echo "Supabase preflight completed."
          echo "No migration SQL was applied by this workflow."
